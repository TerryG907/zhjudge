[project]
name = "zhjudge"
version = "0.1.0"
description = "Chinese-first open typed-decision (System One) model in the Laya checkpoint format: data, training, calibration, evaluation, export"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
# Pinned to the versions the phase-0 spike ran with (except laya, see below).
dependencies = [
  "torch==2.14.0",
  "transformers==5.17.0",
  "tokenizers==0.23.2",
  "safetensors==0.8.0",
  "huggingface-hub==1.32.0",
  "laya==0.3.9",  # the spike used 0.3.7, which has since been removed from PyPI; 0.3.9 is the nearest release
  "numpy==2.5.3",
  "pandas==3.0.6",
  "pyarrow==25.0.1",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
# Apple silicon only: laya-mlx runtime checks in `zhjudge compat` (and MLX inference of the export)
mlx = [
  "mlx==0.32.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "laya-mlx==0.2.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
# Laya's own HTTP server (POST /v1/systemone) and its test client, for `zhjudge compat`
serve = [
  "laya[serve]==0.3.9",
  "fastapi==0.141.1",
  "httpx==0.28.1",
]
# Linux torch variants (scripts/run_all.sh picks one automatically; see README):
#   default  PyPI torch 2.14.0 = CUDA 13.0 build: needs NVIDIA driver >= 580 and a GPU with compute capability >= 7.5
#   cu126    CUDA 12.6 build: older drivers (>= 560) and V100 / P100
#   cpu      CPU-only build: no GPU (skips ~3 GB of CUDA libraries)
cu126 = ["torch==2.14.0"]
cpu = ["torch==2.14.0"]

[project.scripts]
zhjudge = "zhjudge.cli:main"

[build-system]
requires = ["uv_build>=0.8.0,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "zhjudge"

[tool.uv]
conflicts = [[{ extra = "cu126" }, { extra = "cpu" }]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu126", extra = "cu126", marker = "sys_platform == 'linux'" },
  { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
