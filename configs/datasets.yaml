# Training-data allowlist for zhjudge.
#
# 中文：这里列出了 phase-0 调研（census）看过的每一个数据集。只有 `enabled: true` 且有 `converter` 的条目会被
#       `zhjudge build` 下载、转换并用于训练（eval_only 的只用于评估）。`enabled` 已按许可审计 configs/licenses.yaml
#       （2026-09-29，人读版 DATA_LICENSES.md）设置：只有 class 为 ALLOW 或 CONDITIONAL 且有 converter 的条目为 true，
#       共 24 个；nli26_zh_*（中文译本没有许可）等 EXCLUDE 条目为 false。每个条目的 `license:` 指向审计条目，
#       build 和 validate 会复核：审计不允许的来源即使被打开也会被拒绝。
#       许可方案（`data.license_profile`）：default = ALLOW + CONDITIONAL（权重按 CC BY-SA 4.0 发布）；
#       permissive_strict = 另外去掉相同方式共享（share-alike）的训练来源（权重可用 Apache-2.0）。
# English: every dataset the phase-0 census looked at. Only entries with `enabled: true` AND a `converter` are built
#       (and trained on, unless eval_only). `enabled` follows the licence audit in configs/licenses.yaml (2026-09-29,
#       human-readable: DATA_LICENSES.md): true only for the 24 converter entries of class ALLOW or CONDITIONAL; the
#       EXCLUDE ones (e.g. nli26_zh_*, whose Chinese translation carries no licence) stay false. `license:` names the
#       audit entry; build and validate re-check it and refuse a source the audit does not allow even if enabled.
#       Release profiles (`data.license_profile`): default = ALLOW + CONDITIONAL (weights CC BY-SA 4.0);
#       permissive_strict = additionally leaves out share-alike training sources (weights may be Apache-2.0).
#
# Fields
#   enabled         true | false   the licence decision (the trailing comment shows the audit class)
#   license         key of this dataset in configs/licenses.yaml
#   converter       name in zhjudge.data.build.SOURCES, or null (no converter; enabling it would have no effect)
#   role            train | eval_only (never trained on, only its test split is scored) | none (not converted)
#   census_verdict  the spike census' licence verdict: OK / OK-INHERIT / NC / RESEARCH / UNCLEAR (superseded by
#                   the audit class; kept for history)
#   census_status   what the spike did with it
#
# Not governed by this file: (1) decontamination downloads (CLUE dev/test, LocalLLaMA/typed-decisions and, in `full`
# mode, every converter below) are read only to REMOVE overlapping text and are never written or trained on;
# (2) the baseline probe sets (`zhjudge probes`) are evaluation-only. Never add outputs of Jev or any other
# proprietary decision API here.
