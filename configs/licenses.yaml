# Data licence audit for zhjudge / 训练数据许可审计
# Audited 2026-09-29 against live Hugging Face cards and upstream sources. Human-readable version: DATA_LICENSES.md
# Not legal advice. When unsure the auditor chose EXCLUDE.
#
# class:
#   ALLOW        explicit permissive licence from the rights holder (Apache-2.0, MIT, CC0, CC BY, "any purpose").
#                Duties = standard attribution / licence notice (listed in `duties`).
#   CONDITIONAL  usable, but the model card must honour extra duties: share-alike (CC BY-SA / GFDL),
#                inherited upstream text licences, or disclosures. See `duties`.
#   EXCLUDE      non-commercial, research-only, no licence / unknown with no upstream grant, conflicting terms,
#                or terms forbidding redistribution of derivatives. Never train on these.
# role:
#   train          converted by data/build and used for training (dev/test splits are held out)
#   eval_only      may be downloaded at run time to evaluate; never trained on
#   probe_only     licence forbids training; used only locally to compute benchmark numbers, never redistributed
#   decontam_only  downloaded only to remove overlapping text from our train split
#   not_converted  candidate / reference; no converter yet
# share_alike: true => inputs whose share-alike terms may attach to the weights if weights are "adapted material".
# duties / card_notice: `zhjudge export` copies the licence, duties and card_notice (a disclosure the card must carry)
#   of every trained and eval-only source into the model card's attribution table.
#
# Release profiles (see DATA_LICENSES.md section 6):
#   default            class in [ALLOW, CONDITIONAL]                        -> cloud experiments; weights: CC BY-SA 4.0
#   permissive_strict  class in [ALLOW, CONDITIONAL] and share_alike: false -> weights: Apache-2.0

version: 1
audited: "2026-09-29"
profiles:
  default:
    classes: [ALLOW, CONDITIONAL]
    weights_licence: CC-BY-SA-4.0
  permissive_strict:
    classes: [ALLOW, CONDITIONAL]
    share_alike: false
    weights_licence: Apache-2.0

