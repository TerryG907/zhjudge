# v1b: v1 (configs/train_base.yaml, a full copy below: load_config has no include) plus a data and recipe bundle,
# kept out of v1 so that v1 vs v0 measures the format change and v1b vs v1 this bundle (see README, 训练记录).
# Every v1b key is off by default; only this file turns them on (marked "v1b" below).
#   CONFIG=configs/train_v1b.yaml bash scripts/run_all.sh     (Kaggle: CONFIG = "configs/train_v1b.yaml")
run:
  name: mmbert-base-zh-v1b  # v1b: v1 + MNLI 30k, GoEmotions polarity/valence, more oasst2_zh ratings, RL group 64,
                            # a fresh rendering per epoch, Laya question-shape variants and head_max_len 512
  seed: 13
model:
  base: jhu-clsp/mmBERT-base
  revision: c5955035435e2bf121cde7f3c8863ef52ff35d82
  max_len: 1024          # same context budget as laya-multilingual
  head_max_len: 512      # v1b (v1: 256): in v1, all 2000 banking77 test items (77 options) had options cut to 3
                         # tokens with some rendered identically and the instruction cut to 8 tokens, and every
                         # 60-option MASSIVE zh item had options cut (train_stats / eval.json option_fit). Only
                         # many-option questions get a longer head; the runtime reads it from rl_agent_config.
  model_name: zhjudge-mmbert-base
data:
  sources: enabled       # every converter with enabled: true in configs/datasets.yaml
  license_profile: default   # or permissive_strict: no share-alike training sources (then export.license: apache-2.0)
  decontaminate: full    # the spike's full decontamination (downloads ~0.9 GB of datasets once)
  probes: true
  train_sample:          # v1b: train records only (dev/test files unchanged); train refuses a corpus built without it
    mnli_en: 30000       # MNLI train pairs (v1: 12000; the 30k sample contains v1's 12k)
    goemotions_en_valence: 8000   # GoEmotions train comments v1 does not use, asked for polarity / valence (the
                                  # dataset authors' emotion grouping; ambiguous and mixed comments left out)
    oasst2_zh_multi_attr: true    # each oasst2_zh reply also asked for its other rated attributes (quality,
                                  # helpfulness, creativity; one whose most common level exceeds 60% is left out)
    oasst2_zh_prompts: true       # rated oasst2_zh user prompts: their quality
train:
  device: auto           # CUDA > MPS > CPU; env ZHJUDGE_DEVICE overrides
  precision: auto        # bf16 on Ampere+, fp16 + GradScaler on T4/V100; env ZHJUDGE_PRECISION overrides
  epochs: 2
  batch_size: 32         # max sequences per batch
  max_tokens: 8192       # max padded tokens per batch (bounds memory; long inputs get smaller batches)
  grad_accum: 1
  lr_encoder: 5.0e-5
  lr_head: 2.0e-4
  warmup: 0.06
  rl_group: 64           # v1b: noisy logit samples per example for the RL term (v1: 4)
  grad_checkpointing: auto   # on for GPUs with < 20 GiB
  memprobe: true         # CUDA: first measure the step's GPU peak without checkpointing in a separate process
                         # (runs/<name>/memprobe.json, ~1 min, report only; a failure never stops training)
  optimizer_impl: auto   # fused AdamW on CUDA (v0: foreach); a resumed run keeps its checkpoint's kernel
  pad_multiple: 16       # pad training batches to a multiple of 16 tokens (v0: 32): same batches and logits, less
                         # padding; only the head's dropout draws follow the padded shape
  max_train_per_source: 30000  # balance: the largest sources (PAWS-X, CrossWOZ) are subsampled
  format_aug: 0.5        # half of the training records written Laya-style: JSON state with named fields + a
                         # field-aware instruction (30% of those in the other language); see zhjudge/data/views.py
  format_variants: 0.25  # v1b: a quarter of those in another Laya question shape: noul criteria / 是否 labels,
                         # 5 score levels merged into 3, NLI dict criteria, BoolQ as a yes/no choice
  format_aug_per_epoch: true  # v1b: epoch 2 gets a fresh rendering and option order of every training record
  option_shuffle: 0.5    # half of the choice records get their options in a new random order
  calib_frac: 0.02
  calib_cap: 4000
  dev_max_records: 2000
  eval_every: 1000       # optimizer updates between dev evaluations
  save_every: 500        # optimizer updates between resumable checkpoints (~4 GB each, overwritten)
  log_every: 50          # every log line also has |dL/dlogits| of the RL / CE / act terms (glogit_* in train_log)
  monitor_calib_per_source: 120  # with every dev eval: <= 120 held-out calibration records per training source
                         # (about half Laya-style) scored per source / type / rendering (dev_log.jsonl calib_slice)
  max_hours: 0           # per run, e.g. 11 on Kaggle: save + exit 75 before the session ends; rerun to resume
calibrate:
  min_bucket: 200
eval:
  split: test
  max_per_source: 2000
  probes: true
  baseline: true         # re-measure laya-multilingual on the same records (downloads ~650 MB once)
  batch_size: 64
  laya_test: 500         # per source, test records also scored written Laya-style (test:laya:*; ~8.9k decisions)
export:
  name: zhjudge-mmbert-base-v1b
  # weights licence for the model card (DATA_LICENSES.md section 6): cc-by-sa-4.0 when any share-alike source
  # is enabled (the audit's `default` profile); apache-2.0 only for the `permissive_strict` profile
  license: cc-by-sa-4.0
compat:
  n: 200
